name: Build AutoSkip APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/autoskip5
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.autoskip5"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.autoskip5"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 5
                  versionName = "0.5"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="AutoSkip"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".SkipAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/autoskip5/DiagnosticStore.kt <<'EOF'
          package com.example.autoskip5

          object DiagnosticStore {
              @Volatile var eventCount: Int = 0
              @Volatile var lastPackage: String = "-"
              @Volatile var lastEvent: String = "-"
              @Volatile var chromeWindowStatus: String = "UNKNOWN"
              @Volatile var chromeRootPackage: String = "-"
              @Volatile var lastCandidate: String = "No candidate"
              @Volatile var lastAction: String = "Waiting"
              @Volatile var lastTree: String = "No Chrome data yet"
          }
          EOF

          cat > app/src/main/java/com/example/autoskip5/MainActivity.kt <<'EOF'
          package com.example.autoskip5

          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var statusView: TextView

              private val handler = Handler(Looper.getMainLooper())

              private val updater = object : Runnable {
                  override fun run() {
                      statusView.text = """
                          AutoSkip 0.5 diagnostic

                          Chrome events:
                          ${DiagnosticStore.eventCount}

                          Last package:
                          ${DiagnosticStore.lastPackage}

                          Last event:
                          ${DiagnosticStore.lastEvent}

                          Chrome window found:
                          ${DiagnosticStore.chromeWindowStatus}

                          Chrome root package:
                          ${DiagnosticStore.chromeRootPackage}

                          Last candidate:
                          ${DiagnosticStore.lastCandidate}

                          Last action:
                          ${DiagnosticStore.lastAction}

                          Visible Chrome accessibility text:
                          -------------------------
                          ${DiagnosticStore.lastTree}
                      """.trimIndent()

                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val title = TextView(this).apply {
                      text = "AutoSkip 0.5"
                      textSize = 22f
                      setPadding(30, 30, 30, 20)
                  }

                  val accessibilityButton = Button(this).apply {
                      text = "Open Accessibility Settings"

                      setOnClickListener {
                          startActivity(
                              Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          )
                      }
                  }

                  statusView = TextView(this).apply {
                      textSize = 15f
                      setPadding(30, 20, 30, 40)
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(title)
                      addView(accessibilityButton)
                      addView(statusView)
                  }

                  val scrollView = ScrollView(this).apply {
                      addView(container)
                  }

                  setContentView(scrollView)
              }

              override fun onResume() {
                  super.onResume()
                  handler.removeCallbacks(updater)
                  handler.post(updater)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(updater)
              }
          }
          EOF

          cat > app/src/main/java/com/example/autoskip5/SkipAccessibilityService.kt <<'EOF'
          package com.example.autoskip5

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.view.accessibility.AccessibilityWindowInfo

          class SkipAccessibilityService : AccessibilityService() {

              companion object {
                  private const val CHROME_PACKAGE = "com.android.chrome"
                  private const val DEBOUNCE_MS = 1200L
                  private const val MAX_TREE_LINES = 140
              }

              private var lastClickTime = 0L
              private var lastDumpTime = 0L

              private val skipTerms = listOf(
                  "skip ad",
                  "skip ads",
                  "skip",
                  "skip video",
                  "пропустить рекламу",
                  "пропустить",
                  "דלג על המודעה",
                  "דלג"
              )

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  DiagnosticStore.lastAction = "Accessibility connected"
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return

                  val packageName = event.packageName?.toString().orEmpty()

                  DiagnosticStore.lastPackage = packageName
                  DiagnosticStore.lastEvent =
                      AccessibilityEvent.eventTypeToString(event.eventType)

                  if (packageName != CHROME_PACKAGE) return

                  DiagnosticStore.eventCount++

                  val chromeRoot = findChromeRoot()

                  if (chromeRoot == null) {
                      DiagnosticStore.chromeWindowStatus = "NO"
                      DiagnosticStore.chromeRootPackage = "-"
                      DiagnosticStore.lastTree = "Chrome accessibility window not found"
                      DiagnosticStore.lastCandidate = "Not found"
                      DiagnosticStore.lastAction = "No Chrome window"
                      return
                  }

                  DiagnosticStore.chromeWindowStatus = "YES"
                  DiagnosticStore.chromeRootPackage =
                      chromeRoot.packageName?.toString().orEmpty()

                  val now = System.currentTimeMillis()

                  if (now - lastDumpTime > 1000L) {
                      DiagnosticStore.lastTree = dumpTree(chromeRoot)
                      lastDumpTime = now
                  }

                  if (now - lastClickTime < DEBOUNCE_MS) return

                  val candidate = findSkipNode(chromeRoot)

                  if (candidate == null) {
                      DiagnosticStore.lastCandidate = "Not found"
                      return
                  }

                  DiagnosticStore.lastCandidate = describeNode(candidate)

                  if (clickNodeOrParent(candidate)) {
                      DiagnosticStore.lastAction = "ACTION_CLICK success"
                      lastClickTime = now
                      return
                  }

                  if (tapNode(candidate)) {
                      DiagnosticStore.lastAction = "Gesture dispatched"
                      lastClickTime = now
                  } else {
                      DiagnosticStore.lastAction =
                          "Candidate found, click failed"
                  }
              }

              private fun findChromeRoot(): AccessibilityNodeInfo? {

                  for (window: AccessibilityWindowInfo in windows) {
                      val root = window.root ?: continue
                      val pkg = root.packageName?.toString().orEmpty()

                      if (pkg == CHROME_PACKAGE) {
                          return root
                      }
                  }

                  val activeRoot = rootInActiveWindow

                  if (
                      activeRoot?.packageName?.toString() ==
                      CHROME_PACKAGE
                  ) {
                      return activeRoot
                  }

                  return null
              }

              private fun findSkipNode(
                  node: AccessibilityNodeInfo
              ): AccessibilityNodeInfo? {

                  val text =
                      node.text
                          ?.toString()
                          ?.trim()
                          ?.lowercase()
                          .orEmpty()

                  val description =
                      node.contentDescription
                          ?.toString()
                          ?.trim()
                          ?.lowercase()
                          .orEmpty()

                  if (
                      node.isVisibleToUser &&
                      (
                          matchesSkip(text) ||
                          matchesSkip(description)
                      )
                  ) {
                      return node
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue

                      val result = findSkipNode(child)

                      if (result != null) {
                          return result
                      }
                  }

                  return null
              }

              private fun matchesSkip(value: String): Boolean {
                  if (value.isBlank()) return false

                  return skipTerms.any { term ->
                      value == term ||
                      value.startsWith("$term ") ||
                      value.startsWith("$term,") ||
                      value.startsWith("$term.") ||
                      value.contains(" $term ")
                  }
              }

              private fun clickNodeOrParent(
                  originalNode: AccessibilityNodeInfo
              ): Boolean {

                  var node: AccessibilityNodeInfo? = originalNode

                  repeat(10) {
                      val current = node ?: return false

                      if (
                          current.isVisibleToUser &&
                          current.isClickable
                      ) {
                          val clicked =
                              current.performAction(
                                  AccessibilityNodeInfo.ACTION_CLICK
                              )

                          if (clicked) {
                              return true
                          }
                      }

                      node = current.parent
                  }

                  return false
              }

              private fun tapNode(
                  node: AccessibilityNodeInfo
              ): Boolean {

                  val rect = Rect()
                  node.getBoundsInScreen(rect)

                  if (rect.width() <= 0 || rect.height() <= 0) {
                      return false
                  }

                  val x = rect.centerX().toFloat()
                  val y = rect.centerY().toFloat()

                  val path = Path().apply {
                      moveTo(x, y)
                  }

                  val gesture =
                      GestureDescription.Builder()
                          .addStroke(
                              GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  120
                              )
                          )
                          .build()

                  return dispatchGesture(
                      gesture,
                      null,
                      null
                  )
              }

              private fun dumpTree(
                  root: AccessibilityNodeInfo
              ): String {

                  val lines = mutableListOf<String>()

                  collectTree(root, lines)

                  if (lines.isEmpty()) {
                      return "No visible Chrome text nodes"
                  }

                  return lines.joinToString("\n")
              }

              private fun collectTree(
                  node: AccessibilityNodeInfo,
                  lines: MutableList<String>
              ) {

                  if (lines.size >= MAX_TREE_LINES) return

                  if (node.isVisibleToUser) {

                      val text =
                          node.text
                              ?.toString()
                              ?.trim()
                              .orEmpty()

                      val description =
                          node.contentDescription
                              ?.toString()
                              ?.trim()
                              .orEmpty()

                      if (
                          text.isNotBlank() ||
                          description.isNotBlank()
                      ) {

                          val rect = Rect()
                          node.getBoundsInScreen(rect)

                          lines.add(
                              "#${lines.size + 1} " +
                              "text=\"$text\" " +
                              "desc=\"$description\" " +
                              "class=${node.className} " +
                              "clickable=${node.isClickable} " +
                              "id=${node.viewIdResourceName} " +
                              "bounds=$rect"
                          )
                      }
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue

                      collectTree(child, lines)

                      if (lines.size >= MAX_TREE_LINES) {
                          return
                      }
                  }
              }

              private fun describeNode(
                  node: AccessibilityNodeInfo
              ): String {

                  val rect = Rect()
                  node.getBoundsInScreen(rect)

                  return """
                      text=${node.text}
                      desc=${node.contentDescription}
                      class=${node.className}
                      clickable=${node.isClickable}
                      id=${node.viewIdResourceName}
                      bounds=$rect
                  """.trimIndent()
              }

              override fun onInterrupt() {
                  DiagnosticStore.lastAction =
                      "Accessibility interrupted"
              }
          }
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="50"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:packageNames="com.android.chrome"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AutoSkip</string>
              <string name="accessibility_description">
                  AutoSkip diagnostic service for Chrome and YouTube.
              </string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.DarkActionBar" />
          </resources>
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AutoSkip"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: "${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSkip-0.5-diagnostic-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
