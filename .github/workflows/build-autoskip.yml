name: Build AutoSkip APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/example/autoskip2
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.autoskip2"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.autoskip2"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="AutoSkip"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".SkipAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/autoskip2/MainActivity.kt <<'EOF'
          package com.example.autoskip2

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val info = TextView(this).apply {
                      text = """
                          AutoSkip 0.2

                          1. Open Accessibility Settings
                          2. Enable AutoSkip
                          3. Open YouTube in Chrome
                          4. AutoSkip will press Skip when available
                      """.trimIndent()

                      textSize = 18f
                      setPadding(40, 60, 40, 30)
                  }

                  val button = Button(this).apply {
                      text = "Open Accessibility Settings"

                      setOnClickListener {
                          startActivity(
                              Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          )
                      }
                  }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                      addView(info)
                      addView(button)
                  }

                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/example/autoskip2/SkipAccessibilityService.kt <<'EOF'
          package com.example.autoskip2

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.util.Log
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class SkipAccessibilityService : AccessibilityService() {

              companion object {
                  private const val TAG = "AutoSkip"
                  private const val CHROME_PACKAGE = "com.android.chrome"
                  private const val DEBOUNCE_MS = 1200L
              }

              private var lastClickTime = 0L

              private val skipTerms = listOf(
                  "skip ad",
                  "skip ads",
                  "skip",
                  "пропустить рекламу",
                  "пропустить",
                  "דלג על המודעה",
                  "דלג"
              )

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Log.i(TAG, "AutoSkip accessibility service connected")
              }

              override fun onAccessibilityEvent(
                  event: AccessibilityEvent?
              ) {

                  if (event == null) return

                  if (
                      event.packageName?.toString() != CHROME_PACKAGE
                  ) {
                      return
                  }

                  val now = System.currentTimeMillis()

                  if (
                      now - lastClickTime < DEBOUNCE_MS
                  ) {
                      return
                  }

                  val root =
                      rootInActiveWindow ?: return

                  val skipNode =
                      findSkipNode(root) ?: return

                  if (
                      clickNodeOrParent(skipNode)
                  ) {

                      Log.i(
                          TAG,
                          "Skip clicked using ACTION_CLICK"
                      )

                      lastClickTime = now
                      return
                  }

                  if (
                      tapNode(skipNode)
                  ) {

                      Log.i(
                          TAG,
                          "Skip clicked using gesture"
                      )

                      lastClickTime = now
                  }
              }

              private fun findSkipNode(
                  node: AccessibilityNodeInfo
              ): AccessibilityNodeInfo? {

                  val text =
                      node.text
                          ?.toString()
                          ?.trim()
                          ?.lowercase()
                          .orEmpty()

                  val description =
                      node.contentDescription
                          ?.toString()
                          ?.trim()
                          ?.lowercase()
                          .orEmpty()

                  if (
                      node.isVisibleToUser &&
                      (
                          matchesSkip(text) ||
                          matchesSkip(description)
                      )
                  ) {
                      return node
                  }

                  for (
                      i in 0 until node.childCount
                  ) {

                      val child =
                          node.getChild(i)
                              ?: continue

                      val result =
                          findSkipNode(child)

                      if (
                          result != null
                      ) {
                          return result
                      }
                  }

                  return null
              }

              private fun matchesSkip(
                  value: String
              ): Boolean {

                  if (
                      value.isBlank()
                  ) {
                      return false
                  }

                  return skipTerms.any {
                      term ->

                      value == term ||
                      value.startsWith(
                          "$term "
                      )
                  }
              }

              private fun clickNodeOrParent(
                  originalNode:
                      AccessibilityNodeInfo
              ): Boolean {

                  var node:
                      AccessibilityNodeInfo? =
                      originalNode

                  repeat(6) {

                      val current =
                          node ?: return false

                      if (
                          current.isVisibleToUser &&
                          current.isClickable
                      ) {

                          if (
                              current.performAction(
                                  AccessibilityNodeInfo.ACTION_CLICK
                              )
                          ) {
                              return true
                          }
                      }

                      node =
                          current.parent
                  }

                  return false
              }

              private fun tapNode(
                  node:
                      AccessibilityNodeInfo
              ): Boolean {

                  val rect = Rect()

                  node.getBoundsInScreen(
                      rect
                  )

                  if (
                      rect.width() <= 0 ||
                      rect.height() <= 0
                  ) {
                      return false
                  }

                  val path =
                      Path().apply {

                          moveTo(
                              rect.centerX()
                                  .toFloat(),

                              rect.centerY()
                                  .toFloat()
                          )
                      }

                  val gesture =
                      GestureDescription
                          .Builder()
                          .addStroke(
                              GestureDescription
                                  .StrokeDescription(
                                      path,
                                      0,
                                      80
                                  )
                          )
                          .build()

                  return dispatchGesture(
                      gesture,
                      null,
                      null
                  )
              }

              override fun onInterrupt() {

                  Log.i(
                      TAG,
                      "Accessibility service interrupted"
                  )
              }
          }
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:packageNames="com.android.chrome"
              android:description="@string/accessibility_description" />

          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  AutoSkip
              </string>

              <string name="accessibility_description">
                  Automatically presses the YouTube Skip Ad button in Chrome.
              </string>

          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.DarkActionBar" />

          </resources>
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name =
              "AutoSkip"

          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug

      - name:
